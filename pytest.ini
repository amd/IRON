[pytest]
testpaths = iron/operators iron/applications
python_files = test.py
python_classes = Test*
python_functions = test_*
markers =
    extensive: extensive test suite (deselect with '-m "not extensive"')
addopts = -v --tb=short --import-mode=importlib

[pytest]
testpaths = iron/operators iron/applications
python_files = test.py
python_classes = Test*
python_functions = test_*
markers =
    extensive: extensive test suite (deselect with '-m "not extensive"')
    supported_devices(*devices): mark test as only supported on the given devices (e.g. "npu1", "npu2"). All devices supported by default.
addopts = -v --tb=short --import-mode=importlib

minimum_pre_commit_version: '4.0.0'
default_install_hook_types: [pre-commit, pre-push]
exclude: ^(ironenv.*|my_install.*|build)/

repos:
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: 98ad4ddb9c057de2f5b9e93e44e6db959807d68c  # frozen: v23.1.3
  hooks:
    - id: clang-format
      files: \.(c|cc|cpp|cxx|h|hpp)$
      stages: [pre-push]

- repo: https://github.com/psf/black
  rev: 258e7dbf348bc23cb70b8cdf693481c04634ebcc  # frozen: 26.10.1
  hooks:
    - id: black
      stages: [pre-push]

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 38bfb07c0c64c304f47eb52090f8288150c77730  # frozen: v0.17.1
  hooks:
    - id: ruff-check
      stages: [pre-push]

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
    - id: check-yaml
      # mkdocs.yml names Python objects with !!python/name tags; check its
      # syntax without constructing them.
      args: [--unsafe]
    - id: check-toml
    - id: check-json
    - id: check-merge-conflict
    - id: check-case-conflict
    - id: check-added-large-files
      args: [--maxkb=1024]
    - id: end-of-file-fixer
      stages: [pre-push]
      # The prompt and the licence template are read byte for byte.
      exclude: ^(iron/lm/prompt\.txt|\.reuse/templates/.*)$
    - id: trailing-whitespace
      stages: [pre-push]
      args: [--markdown-linebreak-ext=md]
    - id: mixed-line-ending
      stages: [pre-push]
      args: [--fix=lf]

- repo: https://github.com/rhysd/actionlint
  rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
  hooks:
    - id: actionlint
      args: [-shellcheck=, -pyflakes=]

- repo: local
  hooks:
    - id: reuse-lint
      name: Check REUSE compliance
      language: python
      entry: reuse lint-file
      additional_dependencies: ['reuse[charset-normalizer]==6.2.0']
      stages: [pre-push]

    # Runs in the active environment: pyright reads the installed mlir_aie
    # wheel that requirements.txt pins.
    - id: pyright
      name: pyright
      language: system
      entry: pyright
      pass_filenames: false
      types: [python]
      stages: [pre-push]

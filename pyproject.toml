[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iron"
version = "0.1.0"
description = "IRON: Unlocking the Full Potential of NPUs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "numpy",
    "ml_dtypes",
]

[project.optional-dependencies]
# Model.load: a Hugging Face download, its tokenizer and its chat template.
models = ["huggingface_hub", "jinja2", "tokenizers"]

[tool.setuptools.packages.find]
include = ["iron*"]
# The tests, their goldens and toy checkpoints, stay in the repository.
exclude = ["iron.tests*"]

[tool.setuptools.package-data]
"iron.lm" = ["prompt.txt"]
# In every package: what an application reads beside its code at run time.
"*" = [
    "profiles/*.json",
    "profiles/*/*.json",
    "*.json",
    "*.hpp",
    "Makefile",
]

[tool.pyright]
include = ["iron"]
exclude = ["iron/tests", "iron/operators/**/test.py", "**/__pycache__"]
typeCheckingMode = "standard"
reportMissingModuleSource = false
# A loop over chunks or calls, never empty, binds what follows it.
reportPossiblyUnboundVariable = false

# Output that parses on the oldest Python IRON supports; inferred from
# requires-python, black targets every later version too, whose grammar a
# black running on an older Python cannot check.
[tool.black]
target-version = ["py311"]

# mlir-aie's ruff.toml rule set, over every Python file in the repository.
[tool.ruff]
# Black wraps code at 88; what ruff still sees past that is a long string,
# comment or URL black leaves alone.
line-length = 160
extend-exclude = ["ironenv*", "my_install*", "build"]

[tool.ruff.lint]
# D100-D107 (a docstring must exist) are off: this enforces the style of the
# docstrings that exist. D401 is not in the google convention, so it is named.
select = ["E", "F", "I", "N802", "N816", "D", "D401"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

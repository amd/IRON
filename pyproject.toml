[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iron"
version = "0.1.0"
description = "IRON: Unlocking the Full Potential of NPUs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "numpy",
    "torch",
    "ml_dtypes",
]

[tool.setuptools.packages.find]
include = ["iron*"]

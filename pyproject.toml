[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iron"
version = "0.1.0"
description = "IRON: Unlocking the Full Potential of NPUs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "numpy",
    "ml_dtypes",
]

[project.optional-dependencies]
# Chat messages rendered by a checkpoint's chat_template.
models = ["jinja2"]

[tool.setuptools.packages.find]
include = ["iron*"]

[tool.setuptools.package-data]
"iron.lm" = ["prompt.txt"]
# In every package: what an application reads beside its code at run time.
"*" = [
    "profiles/*.json",
    "profiles/*/*.json",
    "*.json",
    "*.npz",
    "*.hpp",
    "Makefile",
]

# After mlir-aie's ruff.toml: the same rule set, on the same file set pyright
# checks (pyrightconfig.json "include"); keep the two lists in step.

target-version = "py311"
# black wraps code at 88; what ruff still sees over that is a string, comment
# or docstring line black leaves alone. 160 clears those without hand-wraps.
line-length = 160

include = ["iron/**/*.py"]

extend-exclude = ["build", "*install*", "ironenv"]

[lint]
# E/F: pyflakes + pycodestyle errors. I: isort. N802/N816: the pep8-naming
# subset mlir-aie keeps. D: pydocstyle in the google convention, on the style
# of docstrings that exist, not their existence (D100-D107 off, as there).
# D205 and D401 are off, unlike mlir-aie: this codebase's summary is a
# sentence that names what a thing is ("The device a design is generated for,
# bound as the current one"), wrapping where it must, not a one-line command.
select = ["E", "F", "I", "N802", "N816", "D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D205", "D401"]

[lint.pydocstyle]
convention = "google"

name: "Commit Test Results to a Branch"

inputs:
  pretty_flags:
    required: false
    default: "--metric='Latency (mean)' --metric='Bandwidth (mean)' --metric='GFLOP/s (mean)' -o pretty.md ./tests_latest.csv"
  branch:
    required: false
    default: "ci"

runs:
  using: "composite"
  steps:
    - name: Commit Test Results to a Branch (Main branch pushes)
      id: commit_main
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      env:
        HOME: /workspace
      shell: bash
      run: |
        export DATE=$(printf '%(%Y_%m_%d_%H_%M_%S)T')
        export COMMIT_SHA=$(git rev-parse --short HEAD)

        ./ci/scripts/pretty.py --date=${DATE} --commit=${COMMIT_SHA} ${{ inputs.pretty_flags }}

        # Ensure remote branch exists; if not, create it from HEAD, then fetch it locally
        if [ -z "$(git ls-remote --heads origin "${{ inputs.branch }}")" ]; then
          git push origin HEAD:refs/heads/${{ inputs.branch }}
        fi
        git fetch origin ${{ inputs.branch }}:${{ inputs.branch }}
        git worktree add ../results ${{ inputs.branch }}
        cp tests_latest.csv ../results/latest.csv
        cp pretty.md ../results/readme.md

        touch ../results/all.csv
        ./ci/scripts/merge_all.py --all ../results/all.csv --latest ../results/latest.csv
        ./ci/scripts/pretty_trends.py ../results/all.csv -o ../results/trends.md

        cd ../results
        git add -f all.csv latest.csv readme.md trends.md
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "Add test results testing commit \`${COMMIT_SHA}\` at ${DATE}" || echo "No changes to commit"
        git push origin ${{ inputs.branch }}
        RESULTS_COMMIT=$(git -C ../results rev-parse HEAD)
        echo "results_commit=$RESULTS_COMMIT" >> "$GITHUB_OUTPUT"
        echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

    - name: Generate Test Results for PR Comment
      id: commit_pr
      if: ${{ startsWith(github.event_name, 'pull_request') }}
      env:
        HOME: /workspace
      shell: bash
      run: |
        export DATE=$(printf '%(%Y_%m_%d_%H_%M_%S)T')
        export COMMIT_SHA=$(git rev-parse --short HEAD)

        ./ci/scripts/pretty.py --date=${DATE} --commit=${COMMIT_SHA} ${{ inputs.pretty_flags }}

        # For PR runs, we don't commit all.csv, but we fetch the main branch all.csv for trends comparison
        # Ensure remote branch exists and fetch it
        if [ -z "$(git ls-remote --heads origin "${{ inputs.branch }}")" ]; then
          echo "Results branch ${{ inputs.branch }} does not exist. Creating empty trends.md"
          echo "No baseline data available for comparison." > trends.md
        else
          git fetch origin ${{ inputs.branch }}:${{ inputs.branch }}
          git worktree add ../results ${{ inputs.branch }}
          
          # Copy the main branch all.csv as baseline for comparison
          if [ -f "../results/all.csv" ]; then
            cp ../results/all.csv ./main_all.csv
            # Merge current test results with main branch baseline for trends
            ./ci/scripts/merge_all.py --all ./main_all.csv --limit 2 --latest ./tests_latest.csv
            ./ci/scripts/pretty_trends.py ./main_all.csv -o ./trends.md
          else
            echo "No baseline data available for comparison." > trends.md
          fi
        fi

        # Store outputs for PR comment
        echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
        echo "date=$DATE" >> "$GITHUB_OUTPUT"

    - name: Comment results on PR
      if: ${{ startsWith(github.event_name, 'pull_request') }}
      uses: actions/github-script@v7
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require('fs');
          const commitSha = '${{ steps.commit_pr.outputs.commit_sha }}';
          const date = '${{ steps.commit_pr.outputs.date }}';
          const server = '${{ github.server_url }}';
          const repo = '${{ github.repository }}';
          
          // Read the pretty.md content
          let prettyContent = '';
          try {
            prettyContent = fs.readFileSync('pretty.md', 'utf8');
          } catch (error) {
            prettyContent = 'Pretty output not available.';
          }
          
          // Read the trends.md content
          let trendsContent = '';
          try {
            trendsContent = fs.readFileSync('trends.md', 'utf8');
          } catch (error) {
            trendsContent = 'Trends not available.';
          }
          
          const body = `<details>
          <summary>📊 Test Results for ${process.env.GITHUB_WORKFLOW}</summary>

          **Source commit:** [${commitSha}](${server}/${repo}/commit/${commitSha})

          **Test date:** ${date}
          
          ${prettyContent}
          
          </details>
          
          <details>
          <summary>📈 Trends (vs main branch) for ${process.env.GITHUB_WORKFLOW}</summary>

          **Source commit:** [${commitSha}](${server}/${repo}/commit/${commitSha})

          **Test date:** ${date}

          ${trendsContent}
          
          </details>`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

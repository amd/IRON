name: "Commit Test Results to a Branch"

inputs:
  pretty_flags:
    required: false
    default: "--metric='Latency (mean)' --metric='Bandwidth (mean)' --metric='GFLOP/s (mean)' ./tests_latest.csv"
  input_csv:
    required: false
    default: "./tests_latest.csv"
  branch:
    required: false
    default: "main"
  repo_user:
    required: false
    defualt: "andrej"
  repo_name:
    required: false
    default: "iron-ci"
  repo_token:  # PAT to the destination repository
    required: true
  commit_back:
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Format results
      shell: bash
      run: |
        export DATE=$(printf '%(%Y_%m_%d_%H_%M_%S)T')
        export COMMIT_SHA=$(git rev-parse --short HEAD)

        ./ci/scripts/pretty.py --date=${DATE} --commit=${COMMIT_SHA} \
          ${{ inputs.pretty_flags }} \
          -o latest.md \
          ${{ inputs.input_csv }}

    - name: Obtain existing results
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repo_user }}/${{ inputs.repo-name }}
        token: ${{ inputs.repo_token }}
        path: results-repo

    - name: Merge with existing results and calculate trends
      id: commit_main
      env:
        HOME: /workspace
      shell: bash
      run: |

        touch results-repo/all.csv

        ./ci/scripts/merge_all.py --all results-repo/all.csv --latest ${{ inputs.input_csv }}
        ./ci/scripts/pretty_trends.py results-repo/all.csv -o results-repo/trends.md
        cp ${{ inputs.input_csv }} results-repo/latest.csv

    - name: Commit back results
      #if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      run: |
        cd results-repo
        git add -f all.csv latest.csv latest.md trends.md
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "Add test results testing commit \`${COMMIT_SHA}\` at ${DATE}" || echo "No changes to commit"
        git push -u origin ${{ inputs.branch }}
        RESULTS_COMMIT=$(git -C ../results rev-parse HEAD)


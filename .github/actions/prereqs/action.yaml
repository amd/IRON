name: "Install IRON Prerequisites"
description: "Create a venv and install requirements.txt and requirements_examples.txt into it."

inputs:
  env_name:
    required: false
    default: "ci_env"

runs:
  using: "composite"
  steps:
    - name: Install Prerequisites
      env:
        HOME: /workspace
      shell: bash
      run: |
        set -euxo pipefail
        python3 -m venv ${{ inputs.env_name }}
        source ${{ inputs.env_name }}/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_examples.txt
        echo "Prerequisites installed into ${{ inputs.env_name }}"

name: "Install IRON Prerequisites"

inputs:
  env_name:
    required: false
    default: "ci_env"

runs:
  using: "composite"
  steps:
    - name: Install Prerequisites
      env:
        HOME: /workspace
      shell: bash
      run: |
        set -euxo pipefail
        python3 -m venv ${{ inputs.env_name }}
        source ${{ inputs.env_name }}/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_stream.txt
        # stream-dse's AIE codegen deps (snax-mlir/snaxc, xdsl-aie, aie-python-extras)
        # are not PyPI dependencies; this console script installs them so the
        # stream-backed operators can generate their MLIR at build time.
        stream-setup-aie
        echo "Prerequisites installed into ${{ inputs.env_name }}"

name: "Run test suite"
description: "Run the operator or application pytest suite in the venv the prereqs action made."

inputs:
  test_flags:
    required: false
    default: ""
  env_name:
    required: false
    default: "ci_env"
  extensive:
    required: false
    default: "false"
  test_suite:
    required: false
    default: "operators"
    description: "Which tests to run: 'operators', 'applications', or 'both'"
  log_level:
    required: false
    default: "WARNING"
    description: "pytest --log-cli-level; raise to DEBUG to see aiecc's compile trail"

runs:
  using: "composite"
  steps:
    - name: Test
      env:
        HOME: /workspace
        AIECC_JOBS: "1"
      shell: "bash"
      run: |
        source ${{ inputs.env_name }}/bin/activate

        MARKS=()
        if [ "${{ inputs.extensive }}" != "true" ]; then
          MARKS=(-m "not extensive")
        fi
        FLAGS=(--log-cli-level=${{ inputs.log_level || 'WARNING' }} ${{ inputs.test_flags }})
        rm -f tests_latest.csv

        case "${{ inputs.test_suite }}" in
          operators)
            pytest "${MARKS[@]}" iron/operators/ iron/tests/ --csv-output=tests_latest.csv "${FLAGS[@]}"
            ;;
          applications)
            # One process per application, so a crash or an OOM kill ends only
            # that model's tests and frees its memory before the next loads.
            # Every process stamps the run's one date, which is how the
            # reports tell this run's rows from the run before's.
            parts=$(mktemp -d)
            date=$(date -u '+%Y-%m-%d %H:%M:%S')
            status=0
            for dir in tests/applications/*/; do
              name=$(basename "$dir")
              code=0
              pytest "${MARKS[@]}" "$dir" --csv-output="$parts/$name.csv" --csv-date="$date" "${FLAGS[@]}" || code=$?
              # 5: every test in it deselected.
              if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then
                echo "::error title=$name::pytest exited $code"
                status=1
              fi
              if [ -s "$parts/$name.csv" ]; then
                ./ci/scripts/merge_all.py --all tests_latest.csv --latest "$parts/$name.csv" --max-age-days 0
              fi
            done
            exit "$status"
            ;;
          *)
            echo "Invalid test_suite: ${{ inputs.test_suite }}"
            exit 1
            ;;
        esac

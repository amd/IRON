name: "Run test suite"
description: "Run the operator or application pytest suite in the venv the prereqs action made."

inputs:
  test_flags:
    required: false
    default: ""
  env_name:
    required: false
    default: "ci_env"
  extensive:
    required: false
    default: "false"
  test_suite:
    required: false
    default: "operators"
    description: "Which tests to run: 'operators', 'applications', or 'both'"
  log_level:
    required: false
    default: "WARNING"
    description: "pytest --log-cli-level; raise to DEBUG to see aiecc's compile trail"

runs:
  using: "composite"
  steps:
    # Timing in amdxdna's default mode reads the clock the NPU ramped to, so
    # the run asks for turbo, as mlir-aie's nightly checks do. Setting a mode
    # needs root and amdxdna refuses turbo while any hardware context is
    # open: a runner that cannot set it warns, and a run that publishes then
    # records no figures (conftest's --pmode).
    - name: NPU power mode
      env:
        PERF_PMODE: turbo
      shell: "bash"
      run: |
        [ -f /opt/xilinx/xrt/setup.sh ] && source /opt/xilinx/xrt/setup.sh
        XRT_SMI=$(command -v xrt-smi) || { echo "::warning::No xrt-smi; the run records the power mode it finds"; exit 0; }
        BDF=$("$XRT_SMI" examine | grep -oE '\[[0-9a-f:.]+\]' | head -1 | tr -d '[]')
        PLATFORM=$("$XRT_SMI" examine -d "$BDF" --report platform)
        if ! grep -qiE "mode[[:space:]]*:[[:space:]]*$PERF_PMODE\b" <<<"$PLATFORM"; then
          if sudo -n "$XRT_SMI" configure -d "$BDF" --pmode "$PERF_PMODE"; then
            PLATFORM=$("$XRT_SMI" examine -d "$BDF" --report platform)
          else
            echo "::warning::The NPU is not in --pmode $PERF_PMODE and cannot be set non-interactively; a run that publishes records no figures in another mode"
          fi
        fi
        grep -iE "mode[[:space:]]*:" <<<"$PLATFORM" || true

    - name: Test
      env:
        HOME: /workspace
        AIECC_JOBS: "1"
        # The publish jobs' condition: only main and devel publish figures.
        REQUIRED_PMODE: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel') && 'turbo' || 'any' }}
      shell: "bash"
      run: |
        source ${{ inputs.env_name }}/bin/activate

        MARKS=()
        if [ "${{ inputs.extensive }}" != "true" ]; then
          MARKS=(-m "not extensive")
        fi
        FLAGS=(--log-cli-level=${{ inputs.log_level || 'WARNING' }} --pmode="$REQUIRED_PMODE" ${{ inputs.test_flags }})
        rm -f tests_latest.csv

        case "${{ inputs.test_suite }}" in
          operators)
            pytest "${MARKS[@]}" iron/operators/ iron/tests/ --csv-output=tests_latest.csv "${FLAGS[@]}"
            ;;
          applications)
            # One process per application, so a crash or an OOM kill ends only
            # that model's tests and frees its memory before the next loads.
            # Every process stamps the run's one date, which is how the
            # reports tell this run's rows from the run before's.
            parts=$(mktemp -d)
            date=$(date -u '+%Y-%m-%d %H:%M:%S')
            status=0
            for dir in tests/applications/*/; do
              name=$(basename "$dir")
              code=0
              pytest "${MARKS[@]}" "$dir" --csv-output="$parts/$name.csv" --csv-date="$date" "${FLAGS[@]}" || code=$?
              # 5: every test in it deselected.
              if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then
                echo "::error title=$name::pytest exited $code"
                status=1
              fi
              if [ -s "$parts/$name.csv" ]; then
                ./ci/scripts/merge_all.py --all tests_latest.csv --latest "$parts/$name.csv"
              fi
            done
            exit "$status"
            ;;
          *)
            echo "Invalid test_suite: ${{ inputs.test_suite }}"
            exit 1
            ;;
        esac

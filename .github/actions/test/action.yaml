name: "Run test suite"

inputs:
  test_flags:
    required: false
    default: "--log tests.log --csv-latest tests_latest.csv"
  env_name:
    required: false
    default: "ci_env"
  testing_dir:
    required: false
    default: "testing"

runs:
  using: "composite"
  steps:
    - name: Test
      env:
        HOME: /workspace
      shell: "bash"
      run: |
        source ${{ inputs.env_name }}/bin/activate
        ./scripts/run_tests.py ${{ inputs.test_flags }} ${{ inputs.testing_dir }}

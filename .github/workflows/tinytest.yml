name: Test Pushing from a GitHub Action

on:
  pull_request: 
  workflow_dispatch:
permissions:
  contents: write

jobs:
  Test:
    runs-on: [self-hosted, docker]
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -x
          echo "Pulled the latest code."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b testbranch-actions
          touch test.txt
          git add test.txt
          git commit -m "Add test results testing commit \`${COMMIT_SHA}\` at ${DATE}" || echo "No changes to commit"
          git remote -vvv
          git push -u origin testbranch-actions

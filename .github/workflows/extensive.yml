name: Extensive Benchmark/Test Suite

on:
  workflow_dispatch:
  schedule:
   - cron:  '0 9 * * *'  # 2 AM MT
  push:
     branches:
       - main

# VJUNG: Introduce concurrency groups named with branch refs.
# VJUNG: If one pushes 5 times on its branch only the most recent commit will trigger CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Test:
    runs-on: [self-hosted, docker]
    permissions:
      contents: write
    steps:
      - name: Pull
        uses: actions/checkout@v4
        env:
          HOME: /workspace

      - name: Prerequisites
        uses: ./.github/actions/prereqs
        with:
          env_name: ci_env

      - name: Build
        uses: ./.github/actions/build
        with:
          env_name: ci_env
          cmake_extra_flags: "-DEXTENSIVE_TESTING=ON"

      - name: Test
        id: test
        continue-on-error: true
        uses: ./.github/actions/test
        with:
          env_name: ci_env

      - name: Commit test results to branch `ci-extensive`
        env:
          HOME: /workspace
        uses: ./.github/actions/commit_results
        with:
          branch: ci-extensive

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        with:
          name: tests-log
          path: tests.log
          retention-days: 7

      - name: Mark workflow as failed if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

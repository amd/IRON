name: Check for new mlir-aie release

on:
  workflow_dispatch: # Allow manual triggering
  schedule:
    - cron: '0 10 * * *' # Run every day at 10 AM UTC (3 AM Mountain)

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: devel

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Get current mlir-aie version
        id: current_version
        run: |
          raw_version=$(grep 'mlir_aie==' requirements.txt | cut -d'=' -f3)
          version=$(echo "$raw_version" | sed 's/^v//')
          echo "Current version: $version"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "raw_version=$raw_version" >> $GITHUB_OUTPUT

      - name: Get the newest mlir-aie release
        id: latest_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PEP 440 order, so a release is proposed only when it is actually
          # ahead of the pin -- which may itself be a nightly dev build.
          pip install packaging
          latest_tag_with_v=$(gh api repos/Xilinx/mlir-aie/releases/latest --jq .tag_name)
          if [ -z "$latest_tag_with_v" ] || [ "$latest_tag_with_v" = "null" ]; then
            echo "Failed to fetch latest release tag."
            exit 1
          fi
          latest_tag="${latest_tag_with_v#v}"
          newer=$(python -c 'import sys; from packaging.version import Version; print(str(Version(sys.argv[2]) > Version(sys.argv[1])).lower())' \
                    "${{ steps.current_version.outputs.version }}" "$latest_tag")
          echo "Latest release: $latest_tag (newer than the pin: $newer)"
          echo "tag_with_v=$latest_tag_with_v" >> $GITHUB_OUTPUT
          echo "tag=$latest_tag" >> $GITHUB_OUTPUT
          echo "newer=$newer" >> $GITHUB_OUTPUT

      - name: Get the llvm-aie (Peano) version that release validated
        id: matched_peano
        if: steps.latest_release.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # mlir-aie pins the Peano nightly it validated in utils/peano-requirements.txt
          # and bumps it from its own update-peano workflow, so reading it at the release
          # tag gives a pair that has already been tested together.
          pin=$(gh api "repos/Xilinx/mlir-aie/contents/utils/peano-requirements.txt?ref=${{ steps.latest_release.outputs.tag_with_v }}" \
                  --jq '.content' | base64 -d | sed -n 's/^llvm-aie==//p')
          if [ -z "$pin" ]; then
            echo "No llvm-aie pin found in mlir-aie at ${{ steps.latest_release.outputs.tag_with_v }}."
            exit 1
          fi
          echo "Matched llvm-aie version: $pin"
          echo "raw_version=$pin" >> $GITHUB_OUTPUT

      - name: Get current llvm-aie (Peano) version
        id: current_peano
        if: steps.latest_release.outputs.newer == 'true'
        run: |
          raw_version=$(grep 'llvm-aie==' requirements.txt | cut -d'=' -f3)
          echo "Current llvm-aie version: $raw_version"
          echo "raw_version=$raw_version" >> $GITHUB_OUTPUT

      - name: Compare versions and create PR
        if: steps.latest_release.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "New version found: ${{ steps.latest_release.outputs.tag_with_v }}. Current version is v${{ steps.current_version.outputs.version }}."

          new_branch="update-mlir-aie-to-${{ steps.latest_release.outputs.tag_with_v }}"

          # Check if branch already exists
          if git ls-remote --exit-code origin "refs/heads/$new_branch"; then
            echo "Branch $new_branch already exists. Skipping update."
            exit 0
          fi

          # Configure git
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Create new branch
          git checkout -b $new_branch

          # Update requirements.txt
          sed -i "s|==${{ steps.current_version.outputs.raw_version }}|==${{ steps.latest_release.outputs.tag_with_v }}|" requirements.txt
          sed -i "s|mlir-aie/releases/expanded_assets/.*|mlir-aie/releases/expanded_assets/${{ steps.latest_release.outputs.tag_with_v }}|" requirements.txt
          sed -i "s|^llvm-aie==.*|llvm-aie==${{ steps.matched_peano.outputs.raw_version }}|" requirements.txt

          # Commit changes
          git add requirements.txt
          git commit -m "Update mlir-aie to version ${{ steps.latest_release.outputs.tag_with_v }}"

          # Push changes
          git push --set-upstream origin $new_branch

          # Create Pull Request
          sed 's|Describe the intent of your PR here.|This PR updates the mlir-aie version from v${{ steps.current_version.outputs.version }} to the latest release, ${{ steps.latest_release.outputs.tag_with_v }}, and the llvm-aie (Peano) pin from ${{ steps.current_peano.outputs.raw_version }} to ${{ steps.matched_peano.outputs.raw_version }} -- the version that release validated.|' .github/PULL_REQUEST_TEMPLATE.md | \
          gh pr create \
            --base devel \
            --head $new_branch \
            --title "Update mlir-aie from v${{ steps.current_version.outputs.version }} to ${{ steps.latest_release.outputs.tag_with_v }}" \
            --body-file -

          # Trigger CI workflows
          echo "Triggering CI workflows..."
          gh workflow run ci-lint.yml --ref $new_branch
          gh workflow run phoenix-small.yml --ref $new_branch
          gh workflow run krackan-small.yml --ref $new_branch
          gh workflow run phoenix-test-examples.yml --ref $new_branch
          gh workflow run krackan-examples.yml --ref $new_branch

      - name: No new version found
        if: steps.latest_release.outputs.newer != 'true'
        run: echo "mlir-aie's pin (${{ steps.current_version.outputs.version }}) is at or past the newest release (${{ steps.latest_release.outputs.tag }})."

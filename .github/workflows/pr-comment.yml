# Adapted from https://stackoverflow.com/a/71683208

# Commenting on a PR is a separate workflow from the others so that PRs from
# forks can receive comments as well. Since this workflow is not triggered by
# a pull request event, but instead by the completion of another workflow, we
# have write permissions to the repository and can therefore comment on the PR.
#
# This workflow collects artifacts from ALL completed CI workflows for the same
# head SHA, arranges them into the {arch}/{suite}/ layout expected by
# pretty_aggregate.py, and posts (or updates) a single aggregated comment.

name: Comment on PR with Test Results

on:
  workflow_run:
    workflows:
      - Krackan - Small Benchmark/Test Suite
      - Krackan - Test Example Applications
      - Phoenix - Small Benchmark/Test Suite
      - Phoenix - Test Example Applications
    types:
      - completed

jobs:
  comment:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # No ref: check out the default branch (trusted base code). This job
        # runs from workflow_run with a write-scoped GITHUB_TOKEN and secrets,
        # so it must not check out the fork's head_sha: actions/checkout now
        # refuses that (pwn-request guard), and running the fork's copy of
        # ci/scripts/pretty_aggregate.py under the write token would be the
        # vulnerability itself. The job only needs the trusted aggregation
        # script; artifacts and PR metadata come from the API, not the tree.

      - name: Check out the results branch
        uses: actions/checkout@v4
        with:
          ref: ci
          path: history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Collect artifacts from all CI runs for this SHA
        id: collect
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const {execFileSync} = require('child_process');

            const headSha = context.payload.workflow_run.head_sha;
            const headBranch = context.payload.workflow_run.head_branch;
            core.info(`Head SHA: ${headSha}, branch: ${headBranch}`);

            // Artifact name -> suite directory. A name outside this map is
            // ignored, which keeps the fork from choosing a path.
            const ARTIFACT_MAP = {
              'results-phoenix-small':    'phoenix/small',
              'results-phoenix-examples': 'phoenix/examples',
              'results-small':            'krackan/small',
              'results-examples':         'krackan/examples',
            };

            // Workflow name -> the suite it reports.
            const WORKFLOWS = {
              'Krackan - Small Benchmark/Test Suite': 'krackan/small',
              'Krackan - Test Example Applications': 'krackan/examples',
              'Phoenix - Small Benchmark/Test Suite': 'phoenix/small',
              'Phoenix - Test Example Applications': 'phoenix/examples',
            };

            const root = path.join(process.env.RUNNER_TEMP, 'results');
            fs.mkdirSync(root, {recursive: true});

            const status = {};
            let foundAny = false;

            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: headSha,
              status: 'completed',
              per_page: 100,
            });

            for (const [wf, suite] of Object.entries(WORKFLOWS)) {
              const matching = runs.data.workflow_runs.filter(r => r.name === wf);
              if (matching.length === 0) {
                core.info(`No completed run found for "${wf}" at ${headSha}`);
                continue;
              }

              const run = matching[0]; // most recent
              status[suite] = run.conclusion || 'unknown';
              core.info(`Found run ${run.id} for "${wf}" (${run.conclusion})`);

              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });

              for (const artifact of artifacts.data.artifacts) {
                const dir = ARTIFACT_MAP[artifact.name];
                if (dir !== suite) continue;

                core.info(`Downloading artifact "${artifact.name}" -> ${dir}`);

                const zip = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                  archive_format: 'zip',
                });

                const zipPath = path.join(process.env.RUNNER_TEMP, `${dir.replace('/', '-')}.zip`);
                fs.writeFileSync(zipPath, Buffer.from(zip.data));

                const destDir = path.join(root, dir);
                fs.mkdirSync(destDir, {recursive: true});
                // The archive is fork-controlled, so take the one member that
                // carries measurements and leave its markdown behind. execFile
                // passes the arguments without a shell.
                execFileSync('unzip', ['-o', '-j', zipPath, 'latest.csv', '-d', destDir],
                             {stdio: 'inherit'});
                foundAny = true;
              }
            }

            fs.writeFileSync(path.join(root, 'status.json'), JSON.stringify(status));

            if (!foundAny) {
              core.info('No artifacts found. Skipping.');
              core.setOutput('skip', 'true');
              return;
            }

            // The pull request number and the commit come from the API, never
            // from an artifact. workflow_run.pull_requests stays empty for a
            // fork, so match the head SHA against the open pull requests.
            let prNumber = '';
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const pull = pulls.find(p => p.head.sha === headSha);
            if (pull) {
              prNumber = String(pull.number);
            } else {
              core.info(`No open pull request has head ${headSha}`);
            }

            core.setOutput('skip', 'false');
            core.setOutput('root', root);
            core.setOutput('pr_number', prNumber);
            core.setOutput('commit_sha', headSha.slice(0, 7));
            core.setOutput('date', context.payload.workflow_run.created_at);

      - name: Generate comment body
        if: steps.collect.outputs.skip != 'true'
        env:
          RESULTS_ROOT: ${{ steps.collect.outputs.root }}
          COMMIT_SHA: ${{ steps.collect.outputs.commit_sha }}
          RUN_DATE: ${{ steps.collect.outputs.date }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          python ci/scripts/pr_comment.py \
            --artifacts "$RESULTS_ROOT" \
            --history history \
            --status "$RESULTS_ROOT/status.json" \
            --commit "$COMMIT_SHA" \
            --commit-url "$SERVER_URL/$REPOSITORY/commit/$COMMIT_SHA" \
            --date "$RUN_DATE" \
            --pages-url "https://$OWNER.github.io/$REPO_NAME/" \
            -o "$RESULTS_ROOT/comment.md"

      - name: Comment on PR
        if: steps.collect.outputs.skip != 'true' && steps.collect.outputs.pr_number != ''
        uses: actions/github-script@v7
        env:
          RESULTS_ROOT: ${{ steps.collect.outputs.root }}
          PR_NUMBER: ${{ steps.collect.outputs.pr_number }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');

            // Through env, never interpolated into this source.
            const root = process.env.RESULTS_ROOT;
            const prNumber = Number(process.env.PR_NUMBER);
            const marker = '<!-- iron-ci-aggregate -->';
            const runUrl = `${process.env.SERVER_URL}/${process.env.REPOSITORY}` +
              `/actions/runs/${context.payload.workflow_run.id}`;

            if (!prNumber || isNaN(prNumber)) {
              console.log('Not triggered by a PR. Skipping comment.');
              return;
            }

            const body = fs.readFileSync(path.join(root, 'comment.md'), 'utf8');

            const comments = await github.rest.issues.listComments({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existing = comments.data.find(c => c.body.includes(marker));
            const post = (text) => existing
              ? github.rest.issues.updateComment({
                  comment_id: existing.id,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: text,
                })
              : github.rest.issues.createComment({
                  issue_number: prNumber,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: text,
                });

            // GitHub rejects an oversized body with 422, but the 65536 characters its
            // message names is not the enforced ceiling (140k bodies post), so
            // there is no constant here worth comparing against.
            let text = body;
            while (true) {
              try {
                await post(text);
                break;
              } catch (error) {
                if (!(error.status === 422 && /too long/i.test(error.message))) throw error;
                if (text.length <= marker.length) {
                  throw new Error('Comment rejected as too long at every size.');
                }
                text = text.slice(0, Math.floor(text.length / 2)) +
                  `\n\n_Truncated, the comment hit GitHub's size limit. Full report in the [workflow run](${runUrl})._\n`;
              }
            }
            core.info(existing ? `Updated comment ${existing.id}` : 'Created new comment');

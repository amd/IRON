name: Krackan - Small Benchmark/Test Suite

on:
  pull_request: 
  workflow_dispatch:
  push:
     branches:
       - main
       - devel
  merge_group:

# VJUNG: Introduce concurrency groups named with branch refs.
# VJUNG: If one pushes 5 times on its branch only the most recent commit will trigger CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test_small_on_krackan:
    name: Test Small Suite on Krackan
    runs-on: [self-hosted, krackan]
    steps:
      - name: Pull
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        env:
          HOME: /workspace

      - name: Prerequisites
        uses: ./.github/actions/prereqs
        with:
          env_name: ci_env

      - name: Patch this runner's Llama config.json (temporary)
        shell: bash
        run: >-
          python3 ci/scripts/hotfix_llama_config.py --weights /srv
          --out "$RUNNER_TEMP/weights" --github-env "$GITHUB_ENV"

      - name: Test
        id: test
        continue-on-error: true
        uses: ./.github/actions/test
        with:
          env_name: ci_env
          extensive: "false"
          test_suite: "operators"

      # A pull request's results go to its comment (pr-comment.yml); a trunk
      # run's are published by the job below, the only one that can push.
      - name: Commit test results
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/devel'
        id: commit_results
        env:
          HOME: /workspace
        uses: ./.github/actions/commit_results
        with:
          dir: krackan/small

      - name: Upload test results
        if: steps.commit_results.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results-small
          path: ${{ steps.commit_results.outputs.results_dir }}
          retention-days: 7

      - name: Upload results to publish
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tests-latest-small
          path: tests_latest.csv
          retention-days: 1

      - name: Mark workflow as failed if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

  publish:
    name: Publish Small Suite Results
    needs: test_small_on_krackan
    if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit_results pushes to the ci branch
    steps:
      - name: Pull
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download test results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tests-latest-small

      - name: Commit test results
        uses: ./.github/actions/commit_results
        with:
          dir: krackan/small

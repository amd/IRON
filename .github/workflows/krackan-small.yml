name: Krackan - Small Benchmark/Test Suite

on:
  pull_request: 
  workflow_dispatch:
  push:
     branches:
       - main
       - devel
  merge_group:

# VJUNG: Introduce concurrency groups named with branch refs.
# VJUNG: If one pushes 5 times on its branch only the most recent commit will trigger CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# commit_results pushes results to the ci branch on pushes to main and devel.
permissions:
  contents: write

jobs:
  test_small_on_krackan:
    name: Test Small Suite on Krackan
    runs-on: [self-hosted, krackan]
    steps:
      - name: Pull
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        env:
          HOME: /workspace

      - name: Prerequisites
        uses: ./.github/actions/prereqs
        with:
          env_name: ci_env

      - name: Patch this runner's Llama config.json (temporary)
        shell: bash
        run: >-
          python3 ci/scripts/hotfix_llama_config.py --weights /srv
          --out "$RUNNER_TEMP/weights" --github-env "$GITHUB_ENV"

      - name: Test
        id: test
        continue-on-error: true
        uses: ./.github/actions/test
        with:
          env_name: ci_env
          extensive: "false"
          test_suite: "operators"

      - name: Commit test results
        id: commit_results
        env:
          HOME: /workspace
        uses: ./.github/actions/commit_results
        with:
          dir: krackan/small

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results-small
          path: ${{ steps.commit_results.outputs.results_dir }}
          retention-days: 7

      - name: Mark workflow as failed if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1
        

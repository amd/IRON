# Publishes the IRON website, the MkDocs site (docs/), as one GitHub Pages
# deployment; its Benchmarks page draws the results the benchmark workflows
# push to the `ci` branch. This workflow also runs after they finish, so the
# page stays current between doc changes.
#
# The repository must have Pages enabled with "GitHub Actions" as its source.

name: Publish Pages

on:
  push:
    branches:
      - devel
  workflow_run:
    workflows:
      - Small Benchmark/Test Suite
      - Extensive Benchmark/Test Suite
      - Test Example Applications
      - Nightly Applications
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Each build reads the whole history, so only the last queued one matters.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    # The `github-pages` environment admits `devel` alone. A run from any other
    # branch reaches the deploy step and GitHub rejects it there.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_branch == 'devel')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check out the results
        uses: actions/checkout@v4
        with:
          ref: ci
          path: results

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs
        run: pip install -r docs/requirements-mkdocs.txt

      # docs/programming_guide is gitignored; conditional_nav.py drops the nav
      # section if this symlink isn't created (not every branch has the tree).
      - name: Link programming_guide into docs tree
        run: test -d programming_guide && ln -s ../programming_guide docs/programming_guide || true

      - name: Write the benchmark data beside the Benchmarks page
        run: python ci/scripts/build_pages.py --results-root results -o docs/benchmarks/data.json

      - name: Build the MkDocs site
        run: mkdocs build --strict

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

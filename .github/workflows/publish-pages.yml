# Publishes the benchmark history site to GitHub Pages. The benchmark workflows
# push their results to the `ci` branch. This workflow runs after they finish
# and rebuilds the site from that branch.
#
# The repository must have Pages enabled with "GitHub Actions" as its source.

name: Publish Benchmark History

on:
  workflow_run:
    workflows:
      - Krackan - Small Benchmark/Test Suite
      - Krackan - Extensive Benchmark/Test Suite
      - Krackan - Test Example Applications
      - Phoenix - Small Benchmark/Test Suite
      - Phoenix - Extensive Benchmark/Test Suite
      - Phoenix - Test Example Applications
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Each build reads the whole history, so only the last queued one matters.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    # The `github-pages` environment admits `devel` alone. A run from any other
    # branch reaches the deploy step and GitHub rejects it there.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'devel')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check out the results
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ci
          path: results

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Build the site
        run: python ci/scripts/build_pages.py --results-root results -o site

      - name: Upload the site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

name: CI - Linting

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Linting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          pip install reuse black actionlint-py==1.7.12.25 shellcheck-py==0.11.0.1

      - name: Check Licenses
        if: success() || failure()
        shell: bash
        run: |
          reuse download --all
          reuse lint

      - name: Format Python
        if: success() || failure()
        run: |
          black --diff . 
          black --check .

      - name: Format C++
        if: success() || failure()
        run: |
          python scripts/clang-format-wrapper.py --diff 
          python scripts/clang-format-wrapper.py --check

      - name: Lint workflows
        if: success() || failure()
        run: actionlint

  Types:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # mlir-aie's Python sources, pinned: reading types needs none of the
      # wheel's native modules.
      - name: Checkout mlir-aie
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Xilinx/mlir-aie
          ref: 2b3f7128305b6dedb77dc967c255dcedaf383d70
          path: mlir-aie
          sparse-checkout: python
      - name: Install dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install pyright==1.1.414 numpy ml_dtypes \
            pytest huggingface_hub tokenizers safetensors jinja2
          mkdir "$RUNNER_TEMP/aie"
          ln -s "$PWD/mlir-aie/python" "$RUNNER_TEMP/aie/aie"
          site=$("$RUNNER_TEMP/venv/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          echo "$RUNNER_TEMP/aie" > "$site/aie-src.pth"

      - name: Check types
        run: |
          "$RUNNER_TEMP/venv/bin/pyright" --pythonpath "$RUNNER_TEMP/venv/bin/python"

name: CI - Linting

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Linting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          pip install reuse black

      - name: Check Licenses
        if: success() || failure()
        shell: bash
        run: |
          reuse download --all
          reuse lint

      - name: Format Python
        if: success() || failure()
        run: |
          black --diff . 
          black --check .

      - name: Format C++
        if: success() || failure()
        run: |
          python scripts/clang-format-wrapper.py --diff 
          python scripts/clang-format-wrapper.py --check

  Types:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      # mlir-aie's Python sources, pinned: reading types needs none of the
      # wheel's native modules.
      - name: Checkout mlir-aie
        uses: actions/checkout@v4
        with:
          repository: Xilinx/mlir-aie
          ref: 843e9c3ec99981032066027bf7c6f4d3769ec5f5
          path: mlir-aie
          sparse-checkout: python
      - name: Install dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install pyright==1.1.414 numpy ml_dtypes \
            pytest huggingface_hub tokenizers safetensors jinja2
          mkdir "$RUNNER_TEMP/aie"
          ln -s "$PWD/mlir-aie/python" "$RUNNER_TEMP/aie/aie"
          site=$("$RUNNER_TEMP/venv/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          echo "$RUNNER_TEMP/aie" > "$site/aie-src.pth"

      - name: Check types
        run: |
          "$RUNNER_TEMP/venv/bin/pyright" --pythonpath "$RUNNER_TEMP/venv/bin/python"

  Docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install -r docs/requirements-mkdocs.txt
      - name: Build docs
        run: mkdocs build --strict

name: CI - Linting

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Linting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pre-commit reuse
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Check Licenses
        if: success() || failure()
        run: |
          reuse download --all
          reuse lint

      # Every hook but pyright, which the Types job runs per Python version.
      - name: Run pre-commit
        if: success() || failure()
        env:
          SKIP: pyright
        run: pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure --color never

  Types:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions the pinned mlir_aie wheel is built for.
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install numpy ml_dtypes huggingface_hub tokenizers jinja2 \
            "$(grep '^pyright==' requirements.txt)"
          # Only golden recording imports them; not IRON's requirements.
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          pip install transformers==5.22.0
          pip install --no-deps \
            --find-links https://github.com/Xilinx/mlir-aie/releases/expanded_assets/latest-wheels-4 \
            "$(grep '^mlir_aie==' requirements.txt)"

      - name: Check types
        run: pyright

  Docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install -r docs/requirements-mkdocs.txt
      - name: Build docs
        run: mkdocs build --strict

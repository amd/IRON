# Merges each runner's results-<runner>-<suite> artifact into the suite's
# history on the ci branch and pushes it. The one job of a hardware workflow
# that can push: the test jobs, which run the commit's code, read only.

name: Publish Results

on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out the results
        uses: actions/checkout@v4
        with:
          ref: ci
          path: results

      - name: Download each runner's results
        uses: actions/download-artifact@v4
        with:
          pattern: results-*-${{ inputs.suite }}
          path: artifacts

      - name: Merge the results and push them to the ci branch
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          git -C results config user.name "github-actions[bot]"
          git -C results config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another suite's publish may push to ci first; merge again onto its tip.
          for attempt in 1 2 3 4 5; do
            for run in artifacts/results-*-"$SUITE"; do
              runner=${run#artifacts/results-}
              ci/scripts/merge_results.sh "$run" "results/${runner%-"$SUITE"}/$SUITE"
            done
            ./ci/scripts/pretty_aggregate.py --results-root results -o results/readme.md
            git -C results add -A
            if git -C results diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi
            git -C results commit -m "Add test results testing commit \`${GITHUB_SHA::7}\`"
            if git -C results push origin ci; then
              exit 0
            fi
            sleep $((attempt * 5 + RANDOM % 10))
            git -C results fetch --depth=1 origin ci
            git -C results reset --hard FETCH_HEAD
          done
          echo "::error::Could not push the $SUITE results to ci in 5 attempts"
          exit 1

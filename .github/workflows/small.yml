name: Small Benchmark/Test Suite

on:
  pull_request: 
  workflow_dispatch:
  push:
     branches:
       - main
       - devel
  merge_group:

# VJUNG: Introduce concurrency groups named with branch refs.
# VJUNG: If one pushes 5 times on its branch only the most recent commit will trigger CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test_small:
    name: Test Small Suite on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: phoenix, name: Phoenix}
          - {runner: krackan, name: Krackan}
    # A fork's pull request never reaches the NPU runners, which hold /srv's
    # weights and the device, as in mlir-aie's self-hosted jobs.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    steps:
      - name: Pull
        uses: actions/checkout@v4
        with:
          persist-credentials: false
        env:
          HOME: /workspace

      - name: Prerequisites
        uses: ./.github/actions/prereqs
        with:
          env_name: ci_env

      - name: Test
        id: test
        continue-on-error: true
        uses: ./.github/actions/test
        with:
          env_name: ci_env
          extensive: "false"
          test_suite: "operators"

      - name: Format test results
        uses: ./.github/actions/format_results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.runner }}-small
          path: results/
          retention-days: 7

      - name: Mark workflow as failed if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

  publish:
    needs: test_small
    if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel') }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-results.yml
    with:
      suite: small

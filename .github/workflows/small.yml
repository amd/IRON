name: Small Benchmark/Test Suite

on:
#  pull_request: 
  workflow_dispatch:
#  push:
#     branches:
#       - main
permissions:
  contents: write

# VJUNG: Introduce concurrency groups named with branch refs.
# VJUNG: If one pushes 5 times on its branch only the most recent commit will trigger CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Test:
    runs-on: [self-hosted, docker]
    steps:
      - name: Pull
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          HOME: /workspace

      - name: Prerequisites
        uses: ./.github/actions/prereqs
        with:
          env_name: ci_env

      - name: Build
        uses: ./.github/actions/build
        with:
          env_name: ci_env

      - name: Test
        id: test
        continue-on-error: true
        uses: ./.github/actions/test
        with:
          env_name: ci_env

      - name: Format, upload and commit back results 
        env:
          HOME: /workspace
        uses: ./.github/actions/commit_results
        with:
          branch: ci-small

      - name: Upload results logs
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
          retention-days: 7

      - name: Mark workflow as failed if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1
        
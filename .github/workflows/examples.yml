name: Test Example Applications

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - devel
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test_examples:
    name: Test Examples on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: phoenix, name: Phoenix}
          # Krackan's device heap holds less control code than Gemma 4 E2B's
          # and EmbeddingGemma 2's full ELFs need (29f679da).
          - {runner: krackan, name: Krackan, xfail_device_heap: "1"}
    # A fork's pull request never reaches the NPU runners, which hold /srv's
    # weights and the device, as in mlir-aie's self-hosted jobs.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    env:
      IRON_XFAIL_DEVICE_HEAP: ${{ matrix.xfail_device_heap }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
        env:
          HOME: /workspace

      - name: Use a compile cache of this job's own
        shell: bash
        run: echo "NPU_CACHE_HOME=$RUNNER_TEMP/npu-cache" >> "$GITHUB_ENV"

      - name: Prerequisites
        uses: ./.github/actions/prereqs
        with:
          env_name: ci_env

      - name: Print mlir-aie version
        shell: bash
        env:
          HOME: /workspace
        run: |
          set -euxo pipefail
          source ci_env/bin/activate
          echo "=== mlir-aie version ==="
          aie-opt --version
          echo "========================"

      - name: Print resource limits
        shell: bash
        run: |
          echo "=== ulimit -a ==="
          ulimit -a
          echo ""
          echo "=== /proc/self/limits ==="
          cat /proc/self/limits
          echo ""
          echo "=== Free memory ==="
          free -h

      - name: Run examples
        id: test
        continue-on-error: true
        uses: ./.github/actions/test
        env:
          PYTHONUNBUFFERED: "1"
          FLM_MODEL_PATH: /srv/fastflowlm
        with:
          env_name: ci_env
          test_suite: "applications"

      - name: Format test results
        uses: ./.github/actions/format_results
        with:
          pretty_flags: "--metric='TTFT (mean)' --metric='TPS (mean)' --metric='Latency (mean)'"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.runner }}-examples
          path: results/
          retention-days: 14

      - name: Upload MLIR artifacts for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlir-artifacts-${{ matrix.runner }}
          path: |
            ${{ env.NPU_CACHE_HOME }}/*/*.mlir
          retention-days: 14
          if-no-files-found: warn

      - name: Clean up this job's compile cache
        # This runner is self-hosted, so $RUNNER_TEMP is not emptied for us
        # between jobs; remove it ourselves, win or lose.
        if: always()
        shell: bash
        run: rm -rf "$NPU_CACHE_HOME"

      - name: Fail workflow if examples failed
        if: steps.test.outcome == 'failure'
        run: exit 1

  publish:
    needs: test_examples
    if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel') }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-results.yml
    with:
      suite: examples
